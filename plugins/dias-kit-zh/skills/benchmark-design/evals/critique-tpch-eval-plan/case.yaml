schema_version: "1.1"
name: critique-tpch-eval-plan
expected_outcome: |
  回复按基准原则审查该方案，发现按严重程度分级，eval-plan-revised.md 给出修订方案。指出的关键问题：每条查询只跑一次，没有重复，也没有方差；冷运行和热运行混在一起（加载后立刻跑查询）；未调优的默认配置 Postgres 被当作主基线，对照的是手工调过的 Quark；手写物理计划使比较不再是按原文执行的 TPC-H（SQL as written），测到的是实现者投入，系统本身没有被测到；总运行时间由少数长查询主导；没有校验查询答案是否正确；16 GB RAM 的笔记本加上 SF10，把内存效应和噪声混在一起；两个规模点支撑不了「扩展得更好」（scales better）的声称。修订方案修正这些问题，并对方案做审计。
